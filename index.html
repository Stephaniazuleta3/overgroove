<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Over Groove</title>
    <link href="https://fonts.googleapis.com/css2?family=Cascadia+Code:wght@300&display=swap" rel="stylesheet"> <!-- Importa la fuente -->
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        body {
            background-color: #CE1126; /* Fondo rojo */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            perspective: 1000px; /* Define la perspectiva 3D */
            flex-direction: column; /* Centra la imagen y el texto */
        }

        .container {
            position: relative; /* Necesario para posicionar la imagen */
            display: flex;
            justify-content: center; /* Centra la imagen */
            align-items: center; /* Centra la imagen verticalmente */
            flex-grow: 1; /* Permite que la imagen ocupe el espacio disponible */
        }

        img {
            max-width: 80%;
            height: auto;
            transform-style: preserve-3d;
            animation: rotate 5s infinite linear; /* Gira en 5 segundos infinitamente */
        }

        @keyframes rotate {
            0% {
                transform: rotateY(0deg);
            }
            100% {
                transform: rotateY(360deg);
            }
        }

        .text {
            position: absolute;
            bottom: 0; /* Alinea el texto en la parte inferior */
            left: 50%;
            transform: translateX(-50%); /* Centra el texto horizontalmente */
            font-family: 'Cascadia Code', monospace;
            font-weight: 300; /* Peso de la fuente */
            font-size: 1rem; /* Tamaño de la fuente más pequeño */
            color: white; /* Color del texto */
            margin-bottom: 20px; /* Ajusta la distancia desde el borde inferior de la ventana */
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="logo.png" alt="Logo">
        <div class="text">Break the mold</div>
    </div>
</body>
</html>
